    <script>
      /* Apply saved theme before first paint to prevent flash of light mode */
      (function () {
        try {
          var t = localStorage.getItem('fp-theme');
          if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
